# Application name
spring.application.name=migration-service

# Server configuration
server.port=8080

# Application context path
server.servlet.context-path=/migration

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging level
logging.level.root=INFO
logging.level.com.metanorph=DEBUG

#http://localhost:8080/migration/swagger-ui/index.html#/csv-upload-controller/uploadCsv

# SQL Server connection properties
#migration.db.url=jdbc:sqlserver://localhost;databaseName=meta_migration;encrypt=true;trustServerCertificate=true
migration.db.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=meta_migration;encrypt=true;trustServerCertificate=true
migration.db.username=test1
migration.db.password=test1
migration.db.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
migration.db.source-table=CLMS_SBIL_STAGING
migration.db.query-timeout-seconds=60
migration.db.fetch-size=500
