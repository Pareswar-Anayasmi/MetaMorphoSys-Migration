table-mapping:

  mappings:
    relation:
      Son: CHILD
      Daughter: CHILD
      Wife: SPOUSE/PARTNER
      Husband: SPOUSE/PARTNER
      Mother: PARENT
      Father: PARENT
      Brother: SIBLING
      Sister: SIBLING

  tables:

    # =========================================================
    # ROOT → CLAIM HISTORY
    # =========================================================
    CLAIM_HISTORY:

      tableName: CLAIM_HISTORY
      guidColumn: claimGuid
      skipIfEmpty: false

      columns:

        claimNum:
          identifiers:
            - CLAIM_NUMBER

        causeOfDeathCd:
          identifiers:
            - TPCR_CAUSE_OF_DEATH

        externalClmIntimationNum:
          identifiers:
            - TPCR_URN

        eventDt:
          identifiers:
            - TPCR_DOD

        intimationDt:
          identifiers:
            - TPCR_DATEOFLODGINGCLAIM
            - TPCR_CREATED_DT

        eventTypeCd:
          identifiers:
            - DEATH

        eventSubTypeCd:
          identifiers:
            - TPCR_CAUSE_OF_DEATH

        accidentDt:
          identifiers:
            - TPCR_DAYOFACCIDENT

        accidentDts:
          identifiers:
            - TPCR_PLACE_OF_ACCIDENT

        claimTypeCd:
          identifiers:
            - DEATH

        adjReasonCd:
          identifiers:
            - TPCR_CPC_CLM_DEC

        adjRemarks:
          identifiers:
            - TPCR_REMARKS

        accidentTm:
          identifiers:
            - TPCR_TIMEOFACCIDENT

        approvedAmtPolCurrency:
          identifiers:
            - PAYMENT_AMOUNT

        typeOfDeathCd:
          identifiers:
            - TPCR_NATURE_OF_ACCIDENT

        statusCd:
          identifiers:
            - TPCR_CLAIM_DECSN

        stageCd:
          identifiers:
            - TPCR_CLAIM_DECSN

      children:
        - CLAIM_HISTORY_POLICY
        - CLAIM_ADDITIONAL_FIELD
        - CLAIM_HISTORY_PAYMENT

    # =========================================================
    # CLAIM CLIENT (CLAIMANT / NOMINEE)
    # =========================================================
    CLAIM_HISTORY_CLIENT:

      tableName: CLAIM_HISTORY_CLIENT
      parent: CLAIM_HISTORY
      parentGuidRef: claim_history_ref_guid
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - roleCd

      columns:

        masterPolicyNum:
          identifiers:
            - TPCR_POLICY_NO

        roleCd:
          identifiers:
            - TPCR_REL_TYPE

        clientCd:
          identifiers:
            -

        relatedToInsuredCd:
          identifiers:
            - TPCR_RELATION


        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

    CLAIM_HISTORY_POLICY:

      tableName: CLAIM_HISTORY_POLICY
      parent: CLAIM_HISTORY
      parentGuidRef: claim_history_ref_guid
      skipIfEmpty: true
      columns:

        policyNum:
          identifiers:
            - TPCR_POLICY_NO

        commencementDt:
          identifiers:
            - DATE_OF_JOINING_SCHEME

        planCd:
          identifiers:
            - PMJJBY

        lastPremRecdDt:
          identifiers:
            - TPCR_PREMREMITDATE

        premiumDueDt:
          identifiers:
            - TPCR_PREMDEBITDATE

        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

    CLAIM_ADDITIONAL_FIELD:

      tableName: CLAIM_ADDITIONAL_FIELD
      parent: CLAIM_HISTORY
      parentGuidRef: claimGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        fromEffectiveDT:
          identifiers:
            -

        lastEffectiveDt:
          identifiers:
            -

        claimGuid:
          identifiers:
            - claimGuid

        claimAddFldGuid:
          identifiers:
            - claimAddFldGuid

        fieldKey:
          identifiers:
            - TPCR_ID
            - TPCR_ACC_NO
            - TPCR_PROCESS
            - TPCR_NOM_CLMNT_SAME
            - TPCR_DEATH_CER_ISSUEDBY
            - TPCR_DOC_RECEIVED
            - TPCR_PROCEED_WITH
            - TPCR_CDSL_OPTION
            - TPCR_SELECT
            - TPCR_CDSL_REASON
            - TPCR_REGION
            - TPCR_SUB_REGION
            - TPCR_DEATH_CERT_NO
            - TPCR_DATE_OF_CLOSURE
            - TPCR_PRIORITY
            - TPCR_CHKR_ID
            - TPCR_CHKR_DT
            - TPCR_DATA_SOURCE
            - TPCR_JAN_REJECTION_ID
            - TPCR_JAN_REJECTION_REMARK
            - TPCR_LIEN_PERIOD_CLAIM
            - TPCR_IMPS_ID
            - TPCR_IMPS_STATUS
            - TPCR_LA_MONBILE
            - TPCR_REQ_CATEGORY
            - TPCR_MERGER_FLAG
            - TPCR_IS_MATCH_DOD_DC
            - TPCR_IS_MATCH_BENIF_ACC
            - PAYMENT_UTR
            - PAYMENT_DATE
            - TPCR_CLAIMID

        fieldValue:
          identifiers:
            - TPCR_ID
            - TPCR_ACC_NO
            - TPCR_PROCESS
            - TPCR_NOM_CLMNT_SAME
            - TPCR_DEATH_CER_ISSUEDBY
            - TPCR_DOC_RECEIVED
            - TPCR_PROCEED_WITH
            - TPCR_CDSL_OPTION
            - TPCR_SELECT
            - TPCR_CDSL_REASON
            - TPCR_REGION
            - TPCR_SUB_REGION
            - TPCR_DEATH_CERT_NO
            - TPCR_DATE_OF_CLOSURE
            - TPCR_PRIORITY
            - TPCR_CHKR_ID
            - TPCR_CHKR_DT
            - TPCR_DATA_SOURCE
            - TPCR_JAN_REJECTION_ID
            - TPCR_JAN_REJECTION_REMARK
            - TPCR_LIEN_PERIOD_CLAIM
            - TPCR_IMPS_ID
            - TPCR_IMPS_STATUS
            - TPCR_LA_MONBILE
            - TPCR_REQ_CATEGORY
            - TPCR_MERGER_FLAG
            - TPCR_IS_MATCH_DOD_DC
            - TPCR_IS_MATCH_BENIF_ACC
            - PAYMENT_UTR
            - PAYMENT_DATE
            - TPCR_CLAIMID

    CLAIM_HISTORY_PAYMENT:

      tableName: CLAIM_HISTORY_PAYMENT
      parent: CLAIM_HISTORY
      parentGuidRef: claim_history_ref_guid
      skipIfEmpty: true

      columns:
        clientRefGuid:
          identifiers:
            - clientRefGuid

        policyNum:
          identifiers:
            - TPCR_POLICY_NO

        accountNumber:
          identifiers:
            - TPCR_BENEF_BNK_ACC_NO
            - TPCR_CLAIMANTBANKACCOUNT

        accountHolderName:
          identifiers:
            - TPCR_CLAIMANT_NAME

        bankName:
          identifiers:
            - TPCR_BENEF_BNK_NAME
            - TPCR_CLAIMANTBANK

        branchName:
          identifiers:
            - TPCR_BENEF_BRNCH_NAME

        branchIdNum1:
          identifiers:
            - TPCR_BENEF_IFSC
            - TPCR_CLAIMANTBRANCHIFSC

        paymentMethodCd:
          literal: BANK_TRANSFER

        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

    CLAIM_HISTORY_COVERAGE:

      tableName: CLAIM_HISTORY_COVERAGE
      parent: CLAIM_HISTORY
      parentGuidRef: CLAIM_HISTORY
      guidColumn: claimHistoryCoverageGuid
      skipIfEmpty: false

      columns:
        claimHistoryCoverageGuid:
          identifiers:
            - claimHistoryCoverageGuid

        claimRefGuid:
          identifiers:
            - CLAIM_HISTORY

        planCd:
          identifiers:
            - PNNJJBY

    CLAIM_HISTORY_COV_BENEFIT:

      tableName: CLAIM_HISTORY_COV_BENEFIT
      parent: CLAIM_HISTORY_COVERAGE
      parentGuidRef: claimHistoryCoverageGuid
      guidColumn: claimHistoryCovBenefitGuid
      skipIfEmpty: false

      columns:
        claimHistoryCoverageGuid:
          identifiers:
            - claimHistoryCoverageGuid

        benefitCd:
          identifiers:
            - PNNJJBY

        claimHistoryCovBenefitGuid:
          identifiers:
            - claimHistoryCovBenefitGuid

    CLAIM_HISTORY_SETTLEMENT:

      tableName: CLAIM_HISTORY_SETTLEMENT
      skipIfEmpty: true

      columns:

        approvedAmtPolCurrency:
          identifiers:
            - PAYMENT_AMOUNT

        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

        claim_history_settlement_guid:
          identifiers:
            - CLAIM_HISTORY_SETTLEMENT_GUID

    TASK:

      tableName: TASK
      skipIfEmpty: true

      columns:

        taskGuid:
          identifiers:
            - TASK_GUID

        claimhistoryrefguid:
          identifiers:
            - claimGuid

        status:
          literal: PENDING

        taskUser:
          literal: Superadmin

        serviceTask:
          literal: CLAIM_INTIMATION

        priority:
          literal: MEDIUM

        startDt:
          literal: GETDATE()

        createdDt:
          literal: GETDATE()

        updatedDt:
          literal: GETDATE()

        baseCompanyCd:
          literal: SBIL

        workQueue:
          literal: CLAIM_INTIMATION

    CLIENT:

      tableName: CLIENT
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - clientTypeCd

      columns:

        externalClientNum:
          identifiers:
            - TPCR_CUST_ID

        clientTypeCd:
          literal: PERSON

        clientNum:
          identifiers:
            - TPCR_CUST_ID

      children:
        - CLIENT_ADDRESS
        - CLIENT_PHONE
        - CLIENT_EMAIL
        - CLIENT_RELATIONSHIP
        - CLIENT_ADD_FLD

    CLIENT_ADDRESS:

      tableName: CLIENT_ADDRESS
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        clientAddressGuid:
          identifiers:
            - clientAddressGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          literal: RESIDENCE

        addressLine1:
          identifiers:
            - TPCR_CLAIMANT_ADD
            - TPCR_ADDRESSLINE1
            - TPCR_NOMINEEADDRESSLINE1
            - TPCR_ADDRESSOFGUARDIAN

        addressLine2:
          identifiers:
            - TPCR_ADDRESSLINE2

        cityCd:
          identifiers:
            - TPCR_CLM_NOM_CITY

        stateCd:
          identifiers:
            - TPCR_CLM_NOM_STATE

        postCode:
          identifiers:
            - TPCR_CLM_NOM_PINCODE

        prefferedFl:
          identifiers:
            - "TRUE"

        districtCd:
          identifiers:
            - TPCR_DISTRICT

    # =========================================================
    # CLIENT PHONE (derived in service logic)
    # =========================================================
    CLIENT_PHONE:

      tableName: CLIENT_PHONE
      parent: CLIENT
      parentGuidRef: clientGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        clientPhoneGuid:
          identifiers:
            - clientPhoneGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          literal: MOBILE

        contactNum:
          identifiers:
            - TPCR_MOBILENUMBER
            - TPD_MOBILENO
            - TPCR_CLAIMANT_MOBNO
            - TPCR_NOMINEEMOBILENUMBER
            - TPCR_GUARDIANMOBILENUMBER

        prefferedFl:
          identifiers:
            - "TRUE"

    # =========================================================
    # CLIENT EMAIL (derived in service logic)
    # =========================================================
    CLIENT_EMAIL:

      tableName: CLIENT_EMAIL
      parent: CLIENT
      parentGuidRef: clientGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        clientEmailGuid:
          identifiers:
            - clientEmailGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          identifiers:
            - typeCd

        emailId:
          identifiers:
            - TPCR_EMAIL
            - TPCR_EMAILID
            - TPCR_CLAIMANTEMAILID
            - TPCR_NOMINEEEMAILID
            - TPCR_GUARDIANEMAILID

        prefferedFl:
          identifiers:
            - "TRUE"

    # =========================================================
    # CLIENT RELATIONSHIP (derived in service logic)
    # =========================================================
    CLIENT_RELATIONSHIP:

      tableName: CLIENT_RELATIONSHIP
      parent: CLIENT
      parentGuidRef: clientGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        clientGuidTo:
          identifiers:
            - clientGuidTo

        relationshipTypeCd:
          literal: PERSON

        relationshipCd:
          identifiers:
            - TPCR_RELATION
            - TPCR_RELATIONOFCLAIMANT
            - TPCR_RELATIONSHIPOFGUARDIAN

        clientNumTo:
          identifiers:
            - TPCR_CUST_ID

        name:
          identifiers:
            - TPCR_BENEF_NAME

        clientGuid:
          identifiers:
            - clientGuid

        clientRelationshipGuid:
          identifiers:
            - clientRelationshipGuid

    # =========================================================
    # CLIENT ADDITIONAL FIELDS (derived in service logic)
    # =========================================================
    CLIENT_ADD_FLD:

      tableName: CLIENT_ADD_FLD
      parent: CLIENT
      parentGuidRef: clientGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        fromEffectiveDT:
          identifiers:
            -

        lastEffectiveDt:
          identifiers:
            -

        clientGuid:
          identifiers:
            - clientGuid

        clientAddFldGuid:
          identifiers:
            - clientAddFldGuid

        fieldKey:
          identifiers:
            - TPCR_INSURERCODE
            - TPCR_BANKCODE
            - TPCR_BRANCH_CODE
            - TPCR_BANKBRANCHEMAILID
            - TPCR_NOM_DOD
            - TPCR_NOM_EXPIRED

        fieldValue:
          identifiers:
            - TPCR_INSURERCODE
            - TPCR_BANKCODE
            - TPCR_BRANCH_CODE
            - TPCR_BANKBRANCHEMAILID
            - TPCR_NOM_DOD
            - TPCR_NOM_EXPIRED

    # =========================================================
    # PERSON (derived in service logic)
    # =========================================================
    PERSON:

      tableName: PERSON
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - roleCd

      # Declared for config consistency; values are filled in service logic.
      columns:
        personGuid:
          identifiers:
            - personGuid

        clientGuid:
          identifiers:
            - clientGuid

        firstName:
          identifiers:
            - TPCR_CLAIMANT_NAME
            - TPCR_NOMINEEFIRSTNAME
            - TPCR_BENEF_NAME
            - TPCR_NAMEOFGUARDIAN
            - TPD_APPLICANTNAME

        genderCd:
          identifiers:
            - TPCR_GENDER
            - TPCR_CLAIMANTGENDER
            - TPCR_NOMINEEGENDER

        dateOfBirth:
          identifiers:
            - TPD_APPLICANT_DOB
            - TPCR_DOB_DECEASED
            - TPCR_CLAIMANT_DOB
            - TPCR_NOM_DOB

        age:
          identifiers:
            - TPCR_NOM_AGE

        otherName:
          identifiers:
            - TPCR_CORRECTNOMINEEFIRSTNAME
            - TPCR_NAMEOFGUARDIAN

        insuredType:
          identifiers:
            -

      children:
        - PERSON_IDENTITY

    # =========================================================
    # PERSON IDENTITY (derived in service logic)
    # =========================================================
    PERSON_IDENTITY:

      tableName: PERSON_IDENTITY
      parent: PERSON
      parentGuidRef: personGuid
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:
        personIdentityGuid:
          identifiers:
            - personIdentityGuid

        personGuid:
          identifiers:
            - personGuid

        identityTypeCd:
          identifiers:
            - identityTypeCd

        identityNum:
          identifiers:
            - TPCR_KYCID1_NUMBER
            - TPCR_KYCID2_NUMBER
            - TPCR_KYCID1NUMBER
            - TPCR_PANNUMBER
            - TPCR_AADHAARNUMBER
            - TPCR_CKYC_NUMBER


