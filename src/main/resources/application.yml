        id:
          identifiers:
            - id

        clientGuidTo:
          identifiers:
            - clientGuidTo

        relationshipTypeCd:
          identifiers:
            - relationshipTypeCd

        relationshipCd:
          identifiers:
            - TPCR_RELATION
            - TPCR_RELATIONOFCLAIMANT
            - TPCR_RELATIONSHIPOFGUARDIAN

        clientNumTo:
          identifiers:
            - TPCR_CUST_ID

        name:
          identifiers:
            - TPCR_BENEF_NAME

        clientGuid:
          identifiers:
            - clientGuid

        clientRelationshipGuid:
          identifiers:
            - clientRelationshipGuid

    # =========================================================
    # CLIENT ADDITIONAL FIELDS (derived in service logic)
    # =========================================================
    CLIENT_ADD_FLD:

      tableName: CLIENT_ADD_FLD
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        fromEffectiveDT:
          identifiers:
            -

        lastEffectiveDt:
          identifiers:
            -

        clientGuid:
          identifiers:
            - clientGuid

        clientAddFldGuid:
          identifiers:
            - clientAddFldGuid

        fieldKey:
          identifiers:
            - TPCR_INSURERCODE
            - TPCR_BANKCODE
            - TPCR_BRANCH_CODE
            - TPCR_BANKBRANCHEMAILID
            - TPCR_NOM_DOD
            - TPCR_NOM_EXPIRED

        fieldValue:
          identifiers:
            - TPCR_INSURERCODE
            - TPCR_BANKCODE
            - TPCR_BRANCH_CODE
            - TPCR_BANKBRANCHEMAILID
            - TPCR_NOM_DOD
            - TPCR_NOM_EXPIRED

    # =========================================================
    # PERSON (derived in service logic)
    # =========================================================
    PERSON:

      tableName: PERSON
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - roleCd

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        personGuid:
          identifiers:
            - personGuid

        clientGuid:
          identifiers:
            - clientGuid

        firstName:
          identifiers:
            - TPCR_NOMINEEFIRSTNAME
            - TPCR_CLAIMANT_NAME
            - TPCR_NAMEOFGUARDIAN

        genderCd:
          identifiers:
            - TPCR_GENDER
            - TPCR_CLAIMANTGENDER
            - TPCR_NOMINEEGENDER

        dateOfBirth:
          identifiers:
            - TPCR_DOB_DECEASED
            - TPCR_CLAIMANT_DOB
            - TPCR_NOM_DOB

        age:
          identifiers:
            - TPCR_NOM_AGE

        otherName:
          identifiers:
            - TPCR_CORRECTNOMINEEFIRSTNAME

        insuredType:
          identifiers:
            -

    # =========================================================
    # PERSON IDENTITY (derived in service logic)
