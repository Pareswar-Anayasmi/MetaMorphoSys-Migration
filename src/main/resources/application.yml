table-mapping:
  tables:

    # =========================================================
    # ROOT → CLAIM HISTORY
    # =========================================================
    CLAIM_HISTORY:

      tableName: CLAIM_HISTORY
      guidColumn: id
      skipIfEmpty: false

      columns:

        claimGuid:
          identifiers:
            - id

        claimNum:
          identifiers:
            - TPCR_CLAIMID

        causeOfDeathCd:
          identifiers:
            - TPCR_CAUSE_OF_DEATH

        externalClmIntimationNum:
          identifiers:
            - TPCR_URN

        eventDt:
          identifiers:
            - TPCR_DOD

        intimationDt:
          identifiers:
            - TPCR_DATEOFLODGINGCLAIM
            - TPCR_CREATED_DT

        eventTypeCd:
          identifiers:
            - DEATH

        eventSubTypeCd:
          identifiers:
            - TPCR_CAUSE_OF_DEATH

        accidentDt:
          identifiers:
            - TPCR_DAYOFACCIDENT

        accidentDts:
          identifiers:
            - TPCR_PLACE_OF_ACCIDENT

        claimTypeCd:
          identifiers:
            - DEATH

        adjReasonCd:
          identifiers:
            - TPCR_CPC_CLM_DEC

        adjRemarks:
          identifiers:
            - TPCR_REMARKS

        accidentTm:
          identifiers:
            - TPCR_TIMEOFACCIDENT

        approvedAmtPolCurrency:
          identifiers:
            - TPCR_APPROVEDAMT

        typeOfDeathCd:
          identifiers:
            - TPCR_NATURE_OF_ACCIDENT

        statusCd:
          identifiers:
            - TPCR_CLAIM_DECSN


      children:
        - CLAIM_HISTORY_POLICY

    # =========================================================
    # CLAIM CLIENT (CLAIMANT / NOMINEE)
    # =========================================================
    CLAIM_HISTORY_CLIENT:

      tableName: CLAIM_HISTORY_CLIENT
      parent: CLAIM_HISTORY
      parentGuidRef: claim_history_ref_guid
      guidColumn: id
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - roleCd

      columns:

        clientRefGuid:
          identifiers:
            - id

        masterPolicyNum:
          identifiers:
            - TPCR_POLICY_NO

        roleCd:
          identifiers:
            - TPCR_REL_TYPE

        clientCd:
          identifiers:
            - TPCR_CUST_ID

        relatedToInsuredCd:
          identifiers:
            - TPCR_RELATION


        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

    CLAIM_HISTORY_POLICY:

      tableName: CLAIM_HISTORY_POLICY
      parent: CLAIM_HISTORY
      parentGuidRef: claim_history_ref_guid
      guidColumn: id
      skipIfEmpty: true
      columns:

        policyNum:
          identifiers:
            - TPCR_POLICY_NO

        commencementDt:
          identifiers:
            -

        planCd:
          identifiers:
            - PMJJBY

        lastPremRecdDt:
          identifiers:
            - TPCR_PREMREMITDATE

        premiumDueDt:
          identifiers:
            - TPCR_PREMDEBITDATE

        claim_history_ref_guid:
          identifiers:
            - claim_history_ref_guid

    CLAIM_ADDITIONAL_FIELD:

      tableName: CLAIM_ADDITIONAL_FIELD
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        fromEffectiveDT:
          identifiers:
            -

        lastEffectiveDt:
          identifiers:
            -

        claimGuid:
          identifiers:
            - claimGuid

        claimAddFldGuid:
          identifiers:
            - claimAddFldGuid

        fieldKey:
          identifiers:
            - TPCR_ID
            - TPCR_PROCESS
            - TPCR_NOM_CLMNT_SAME
            - TPCR_DEATH_CER_ISSUEDBY
            - TPCR_DOC_RECEIVED
            - TPCR_PROCEED_WITH
            - TPCR_CDSL_OPTION
            - TPCR_SELECT
            - TPCR_CDSL_REASON
            - TPCR_REGION
            - TPCR_SUB_REGION
            - TPCR_DEATH_CERT_NO
            - TPCR_DATE_OF_CLOSURE
            - TPCR_PRIORITY
            - TPCR_CHKR_ID
            - TPCR_CHKR_DT
            - TPCR_DATA_SOURCE
            - TPCR_JAN_REJECTION_ID
            - TPCR_JAN_REJECTION_REMARK
            - TPCR_LIEN_PERIOD_CLAIM
            - TPCR_IMPS_ID
            - TPCR_IMPS_STATUS
            - TPCR_LA_MONBILE
            - TPCR_REQ_CATEGORY
            - TPCR_MERGER_FLAG
            - TPCR_IS_MATCH_DOD_DC
            - TPCR_IS_MATCH_BENIF_ACC

        fieldValue:
          identifiers:
            - TPCR_ID
            - TPCR_PROCESS
            - TPCR_NOM_CLMNT_SAME
            - TPCR_DEATH_CER_ISSUEDBY
            - TPCR_DOC_RECEIVED
            - TPCR_PROCEED_WITH
            - TPCR_CDSL_OPTION
            - TPCR_SELECT
            - TPCR_CDSL_REASON
            - TPCR_REGION
            - TPCR_SUB_REGION
            - TPCR_DEATH_CERT_NO
            - TPCR_DATE_OF_CLOSURE
            - TPCR_PRIORITY
            - TPCR_CHKR_ID
            - TPCR_CHKR_DT
            - TPCR_DATA_SOURCE
            - TPCR_JAN_REJECTION_ID
            - TPCR_JAN_REJECTION_REMARK
            - TPCR_LIEN_PERIOD_CLAIM
            - TPCR_IMPS_ID
            - TPCR_IMPS_STATUS
            - TPCR_LA_MONBILE
            - TPCR_REQ_CATEGORY
            - TPCR_MERGER_FLAG
            - TPCR_IS_MATCH_DOD_DC
            - TPCR_IS_MATCH_BENIF_ACC

    CLAIM_HISTORY_PAYMENT:

      tableName: CLAIM_HISTORY_PAYMENT
      skipIfEmpty: true

      columns:

        id:
          identifiers:
            - id

        clientRefGuid:
          identifiers:
            - clientRefGuid

        policyNum:
          identifiers:
            - TPCR_CUST_ID

        accountNumber:
          identifiers:
            - TPCR_ACC_NO
            - TPCR_BENEF_BNK_ACC_NO
            - TPCR_CLAIMANTBANKACCOUNT

        accountHolderName:
          identifiers:
            - TPCR_CLAIMANT_NAME

        bankName:
          identifiers:
            - TPCR_BENEF_BNK_NAME
            - TPCR_CLAIMANTBANK

        branchName:
          identifiers:
            - TPCR_BENEF_BRNCH_NAME

        branchIdNum1:
          identifiers:
            - TPCR_BENEF_IFSC
            - TPCR_CLAIMANTBRANCHIFSC

        paymentMethodCd:
          identifiers:
            - Single/Regular

    CLAIM_HISTORY_COVERAGE:

      tableName: CLAIM_HISTORY_COVERAGE
      guidColumn: claimHistoryCoverageGuid
      skipIfEmpty: false

      columns:

        id:
          identifiers:
            - id

        claimHistoryCoverageGuid:
          identifiers:
            - claimHistoryCoverageGuid

        planCd:
          identifiers:
            - PNNJJBY

    CLAIM_HISTORY_COV_BENEFIT:

      tableName: CLAIM_HISTORY_COV_BENEFIT
      parent: CLAIM_HISTORY_COVERAGE
      parentGuidRef: claimHistoryCoverageGuid
      guidColumn: guid
      skipIfEmpty: false

      columns:

        id:
          identifiers:
            - id

        claimHistoryCoverageGuid:
          identifiers:
            - claimHistoryCoverageGuid

        benefitCd:
          identifiers:
            - PNNJJBY

        guid:
          identifiers:
            - guid

    CLIENT:

      tableName: CLIENT
      guidColumn: id
      skipIfEmpty: true

      createAdditionalRow:
        condition:
          anyNotEmpty:
            - clientTypeCd

      columns:

        externalClientNum:
          identifiers:
            - TPCR_CUST_ID

        clientTypeCd:
          identifiers:
            - TPCR_REL_TYPE

        clientNum:
          identifiers:
            - TPCR_CUST_ID

    # =========================================================
    # CLIENT ADDRESS (derived in service logic)
    # =========================================================
    CLIENT_ADDRESS:

      tableName: CLIENT_ADDRESS
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        clientAddressGuid:
          identifiers:
            - clientAddressGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          identifiers:
            - typeCd

        addressLine1:
          identifiers:
            - TPCR_CLAIMANT_ADD
            - TPCR_ADDRESSLINE1
            - TPCR_NOMINEEADDRESSLINE1
            - TPCR_ADDRESSOFGUARDIAN

        addressLine2:
          identifiers:
            - TPCR_ADDRESSLINE2

        cityCd:
          identifiers:
            - TPCR_CLM_NOM_CITY

        stateCd:
          identifiers:
            - TPCR_CLM_NOM_STATE

        postCode:
          identifiers:
            - TPCR_CLM_NOM_PINCODE

        prefferedFl:
          identifiers:
            - TRUE

        districtCd:
          identifiers:
            - TPCR_DISTRICT

    # =========================================================
    # CLIENT PHONE (derived in service logic)
    # =========================================================
    CLIENT_PHONE:

      tableName: CLIENT_PHONE
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        clientPhoneGuid:
          identifiers:
            - clientPhoneGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          identifiers:
            - typeCd

        contactNum:
          identifiers:
            - TPCR_MOBILENUMBER
            - TPCR_CLAIMANT_MOBNO
            - TPCR_NOMINEEMOBILENUMBER
            - TPCR_GUARDIANMOBILENUMBER

        prefferedFl:
          identifiers:
            - TRUE

    # =========================================================
    # CLIENT EMAIL (derived in service logic)
    # =========================================================
    CLIENT_EMAIL:

      tableName: CLIENT_EMAIL
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
      columns:

        id:
          identifiers:
            - id

        clientEmailGuid:
          identifiers:
            - clientEmailGuid

        clientGuid:
          identifiers:
            - clientGuid

        typeCd:
          identifiers:
            - typeCd

        emailId:
          identifiers:
            - TPCR_EMAIL
            - TPCR_EMAILID
            - TPCR_CLAIMANTEMAILID
            - TPCR_NOMINEEEMAILID
            - TPCR_GUARDIANEMAILID

        prefferedFl:
          identifiers:
            - TRUE

    # =========================================================
    # CLIENT RELATIONSHIP (derived in service logic)
    # =========================================================
    CLIENT_RELATIONSHIP:

      tableName: CLIENT_RELATIONSHIP
      skipIfEmpty: true

      # Declared for config consistency; values are filled in service logic.
